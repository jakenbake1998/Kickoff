<!doctype html>
<html><head><meta charset="utf-8"><title>Kickoff</title>
<style>
:root{
  --bg:#17191d; --panel:#20242a; --ink:#eef0f3; --muted:#9097a3; --line:#2e333b;
  --accent:#f0962e; --good:#6fcf97; --warn:#f2c14e; --bad:#ef6b6b;
  --display:"Bricolage Grotesque",-apple-system,Helvetica,sans-serif;
  --body:"IBM Plex Sans",-apple-system,Helvetica,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--body);display:flex;flex-direction:column;padding:14px 16px 12px;overflow:hidden}
header{display:flex;align-items:center;gap:10px}
.brand{font:700 15px var(--display);color:var(--accent);letter-spacing:.2px}
.project{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:600 12px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.hero{display:flex;align-items:baseline;gap:10px;margin:14px 0 8px}
.count{font:700 44px/1 var(--display)}
.count small{font-size:24px;color:var(--muted)}
.label{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .4s}
.fill.done{background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.on{background:var(--good)} .run{background:var(--accent)} .wait{background:var(--muted)} .bad{background:var(--bad)}
.list{flex:1;overflow-y:auto;border-top:1px solid var(--line);margin:0 -4px;padding:4px}
.row{display:flex;align-items:flex-start;gap:9px;padding:6px 2px;border-bottom:1px solid var(--line)}
.row .dot{margin-top:5px}
.name{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{font-size:12px;color:var(--muted)}
.why.badtext{color:var(--bad)}
.grow{flex:1;min-width:0}
.px{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.show{flex:none;font-size:11px;padding:3px 8px;align-self:center}
button.make{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:var(--muted);gap:6px}
.empty b{font:700 16px var(--display);color:var(--ink)}
.foot{color:var(--muted);font-size:11px;margin-top:6px;min-height:14px}
</style></head>
<body>
<header><span class="brand">Kickoff proxies</span><span class="project" id="project"></span>
  <button id="make" class="make" style="display:none" title="Renders on the Razer, then attaches here.">Make missing proxies</button>
  <button id="find" title="Look for proxies already on the drive (Proxies folders near the footage) and attach the ones that match">Find on drive</button>
  <button id="again" title="Check every proxy again, e.g. after re-rendering one">Check again</button></header>
<div id="main" style="display:none;flex:1;min-height:0;flex-direction:column">
  <div class="hero"><span class="count" id="count">0</span><span class="label" id="label">proxies attached</span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
</div>
<div class="empty" id="empty"><b>No proxies yet</b>Proxies already on the drive: press Find on drive.<br>New ones: turn on Settings &gt; Proxies in Kickoff, and each is attached as the Razer finishes it.</div>
<div class="foot" id="foot"></div>
<script>
// Attaches each proxy the Razer finishes to its clip in the open project, once the proxy's length and
// timecode match the original (a duplicate or cut-short render is never attached). Every 10 s it also
// puts back any proxy a clip has lost (a re-import, a detach). Kickoff writes the jobs to
// ~/Library/Application Support/Kickoff/proxy-jobs/<project>.json.
var fs = require("fs"), path = require("path"), os = require("os"), cp = require("child_process");
var HOME = os.homedir(), DIR = path.join(HOME, "Library/Application Support/Kickoff/proxy-jobs");
var FONTS = path.join(HOME, "Library/Application Support/Kickoff/ui/fonts");
var FFPROBE = ["/opt/homebrew/bin/ffprobe", "/usr/local/bin/ffprobe"].filter(function (p) { return fs.existsSync(p); })[0];
var busy = false, force = false, note = null;

// the window's own fonts, when Kickoff is installed (the panel works without them)
[["Bricolage Grotesque", "bricolage-700.woff2", "700"], ["IBM Plex Sans", "plex-sans.woff2", "100 700"]].forEach(function (f) {
  var p = path.join(FONTS, f[1]);
  if (fs.existsSync(p)) {
    var st = document.createElement("style");
    st.textContent = '@font-face{font-family:"' + f[0] + '";font-weight:' + f[2] + ';src:url("file://' + encodeURI(p) + '") format("woff2")}';
    document.head.appendChild(st);
  }
});

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function evalHost(code) {
  return new Promise(function (ok) { window.__adobe_cep__.evalScript(code, function (r) { ok(r); }); });
}
function probe(file) {
  return new Promise(function (ok) {
    if (!FFPROBE) return ok(null);
    cp.execFile(FFPROBE, ["-v", "error", "-print_format", "json", "-show_format", "-show_streams", file],
      { timeout: 20000 }, function (err, out) {
        if (err) return ok(null);
        try {
          var j = JSON.parse(out), f = j.format || {}, tc = (f.tags || {}).timecode || "", fps = 0;
          (j.streams || []).forEach(function (s) {
            if (!tc && s.tags && s.tags.timecode) tc = s.tags.timecode;
            if (!fps && s.codec_type === "video" && s.avg_frame_rate) {
              var r = s.avg_frame_rate.split("/"); fps = +r[1] ? r[0] / r[1] : 0;
            }
          });
          ok({ dur: parseFloat(f.duration || 0), tc: tc, fps: fps, video: (j.streams || []).some(function (s) { return s.codec_type === "video"; }) });
        } catch (e) { ok(null); }
      });
  });
}
function frames(tc, fps) {
  var m = /^(\d+):(\d+):(\d+)[:;.](\d+)$/.exec(tc || ""), r = Math.round(fps || 24);
  return m ? ((+m[1] * 60 + +m[2]) * 60 + +m[3]) * r + +m[4] : null;
}
function check(job, p) {
  if (!p) return "Kickoff couldn't read the proxy";
  var slack = 0.1 + 1 / (job.fps || 24);
  if (Math.abs(p.dur - job.dur) > slack) return "proxy is " + p.dur.toFixed(1) + " s, the clip " + job.dur.toFixed(1) + " s";
  if (job.tc) {
    var a = frames(job.tc, job.fps), b = frames(p.tc, job.fps);
    if (b === null || a !== b) return "proxy timecode " + (p.tc || "missing") + ", the clip " + job.tc;
  }
  return "";
}
function getJobs(base) {
  return fetch(base + "/api/jobs").then(function (r) { return r.json(); }).then(function (j) { return j.jobs || []; });
}

async function tick() {
  if (busy) return;
  busy = true;
  var offline = false;
  try {
    var files = fs.existsSync(DIR) ? fs.readdirSync(DIR).filter(function (f) { return /\.json$/.test(f); }) : [];
    var sets = [];
    for (var fi = 0; fi < files.length; fi++) {
      var fp = path.join(DIR, files[fi]), d;
      try { d = JSON.parse(fs.readFileSync(fp, "utf8")); } catch (e) { continue; }
      if (force && !d.jobs.some(function (j) { return j.local; })) d.jobs.forEach(function (j) { delete j.problem; delete j.verified; });
      var open = d.jobs.filter(function (j) { return !j.verified && !j.problem && !j.local; });
      if (open.length) {
        var live = null;
        try { live = await getJobs(d.razer); } catch (e) { offline = true; }
        if (live) {
          var byId = {};
          live.forEach(function (j) { byId[j.id] = j; });
          for (var k = 0; k < open.length; k++) {
            var job = open[k], lj = byId[job.id];
            job.razer = lj ? lj.state : "";
            if (!lj) continue;
            if (lj.state === "failed" || lj.state === "cancelled") { job.problem = "the Razer couldn't make it" + (lj.error ? " (" + lj.error + ")" : ""); continue; }
            if (lj.state !== "done") { job.stage = lj.n && lj.total ? Math.round(100 * lj.n / lj.total) + "%" : ""; continue; }
            job.proxy = lj.proxy_mac || job.proxy;
            var why = check(job, await probe(job.proxy));
            if (why) job.problem = why; else job.verified = true;
          }
        }
      }
      fs.writeFileSync(fp, JSON.stringify(d, null, 1));
      sets.push({ file: fp, d: d, mtime: fs.statSync(fp).mtimeMs });
    }
    force = false;
    // one pass over the open project for every checked proxy
    var ready = [];
    sets.forEach(function (s) { s.d.jobs.forEach(function (j) { if (j.verified) ready.push({ clip: j.clip, proxy: j.proxy }); }); });
    var inProj = {};
    if (ready.length) {
      try { inProj = JSON.parse(await evalHost("kickoffSync(" + JSON.stringify(JSON.stringify(ready)) + ")")) || {}; } catch (e) { inProj = {}; }
    }
    // a remade proxy is attached: the bad one it replaced goes to the Trash (listed when you confirmed)
    for (var si = 0; si < sets.length; si++) {
      var dirty = false;
      sets[si].d.jobs.forEach(function (j) {
        if (j.replaces && !j.trashed && j.verified && inProj[j.clip] === "on") { trash(j.replaces); j.trashed = true; dirty = true; }
      });
      if (dirty) fs.writeFileSync(sets[si].file, JSON.stringify(sets[si].d, null, 1));
    }
    var all = [];
    try { all = JSON.parse(await evalHost("kickoffAll()")) || []; } catch (e) { all = []; }
    var byClip = {};
    sets.sort(function (a, b) { return a.mtime - b.mtime; }).forEach(function (s) {
      s.d.jobs.forEach(function (j) { byClip[j.clip] = j; });     // the newest set's job wins
    });
    render(all, byClip, offline);
  } finally { busy = false; }
}

var missing = [];
function render(all, byClip, offline) {
  var rows = [], n = { on: 0, run: 0, wait: 0, bad: 0, none: 0 };
  missing = [];
  all.forEach(function (c) {
    var clip = c[0], px = c[1], j = byClip[clip], st, why, file = "";
    if (px) { st = "on"; why = "attached"; file = px === "?" ? "" : px; }
    else if (j && j.problem) { st = "bad"; why = j.problem; file = j.proxy || ""; }
    else if (j && j.verified) { st = "bad"; why = "Premiere wouldn't take this proxy"; file = j.proxy || ""; }
    else if (j && !j.local && !j.problem) { st = "run"; why = j.razer === "running" ? "rendering on the Razer" + (j.stage ? " " + j.stage : "") : "waiting on the Razer"; }
    else { st = "none"; why = "no proxy"; }
    if (st === "bad" || st === "none") missing.push({ clip: clip, bad: st === "bad" ? file : "" });
    n[st]++;
    rows.push({ st: st, why: why, name: path.basename(clip), file: file });
  });
  var total = rows.length;
  $("main").style.display = total ? "flex" : "none";
  $("empty").style.display = total ? "none" : "flex";
  $("project").textContent = projName;
  $("count").innerHTML = n.on + "<small> / " + total + "</small>";
  $("label").textContent = n.on === total && total ? "proxies attached, all done" : "proxies attached";
  $("fill").style.width = total ? (100 * n.on / total) + "%" : "0";
  $("fill").className = "fill" + (total && n.on === total ? " done" : "");
  var chips = [["run", n.run, "rendering"], ["bad", n.bad, "refused"], ["wait", n.none, "no proxy"]];
  $("chips").innerHTML = chips.filter(function (c) { return c[1]; }).map(function (c) {
    return '<span class="chip"><span class="dot ' + c[0] + '"></span>' + c[1] + " " + c[2] + "</span>";
  }).join("");
  $("make").style.display = missing.length ? "" : "none";
  $("make").textContent = "Make missing proxies (" + missing.length + ")";
  var order = { bad: 0, none: 1, run: 2, on: 3 };
  rows.sort(function (a, b) { return order[a.st] - order[b.st] || a.name.localeCompare(b.name); });
  $("list").innerHTML = rows.map(function (r) {
    var where = r.file ? '<div class="px">' + esc(path.basename(r.file)) + "  in  " + esc(path.dirname(r.file)) + "</div>" : "";
    return '<div class="row"><span class="dot ' + (r.st === "none" ? "wait" : r.st) + '"></span><div class="grow"><div class="name">' + esc(r.name) +
      '</div><div class="why' + (r.st === "bad" ? " badtext" : "") + '">' + esc(r.why) + "</div>" + where + "</div>" +
      (r.file ? '<button class="show" data-path="' + esc(r.file) + '">Show in Finder</button>' : "") + "</div>";
  }).join("");
  $("foot").textContent = offline ? "The Razer isn't answering. Proxies still rendering will attach once it's back." :
    note && Date.now() - note.t < 60000 ? note.text : "Checks every 10 seconds.";
}
var projName = "";
evalHost("app.project.name").then(function (r) { projName = String(r || "").replace(/\.prproj$/i, ""); });
$("list").onclick = function (e) {
  var b = e.target.closest ? e.target.closest("button.show") : null;
  if (b) cp.execFile("/usr/bin/open", ["-R", b.getAttribute("data-path")]);
};
function trash(p) {
  if (!p || !fs.existsSync(p)) return;
  cp.execFile("/usr/bin/osascript", ["-e", 'tell application "Finder" to delete (POSIX file ' + JSON.stringify(p) + " as alias)"], function () {});
}
function kickoffSettings() {
  try { return JSON.parse(fs.readFileSync(path.join(HOME, "Library/Application Support/Kickoff/settings.json"), "utf8")) || {}; } catch (e) { return {}; }
}

// ---- Make missing proxies: the clips with no proxy (or a refused one) go to the Razer ----
async function makeMissing() {
  if (!missing.length || busy) return;
  var set = kickoffSettings(), base = (set.razer_url || "http://kickoff.local").replace(/\/$/, "");
  var res = set.razer_proxies === "1080" ? "1080" : "720";
  var list = missing.filter(function (m) { return /^\/Volumes\/[^/]+\//.test(m.clip); });
  if (!list.length) { note = { t: Date.now(), text: "These clips aren't on an external drive, so the Razer can't reach them." }; return tick(); }
  var bad = list.filter(function (m) { return m.bad; });
  var msg = "Make " + list.length + " prox" + (list.length === 1 ? "y" : "ies") + " on the Razer (" + res + "p ProRes Proxy, in a Proxies folder next to the footage)?";
  if (bad.length) msg += "\n\n" + (bad.length === 1 ? "This bad proxy goes" : "These " + bad.length + " bad proxies go") + " to the Trash once the new one is attached:\n" +
    bad.map(function (m) { return path.basename(m.bad); }).join("\n");
  if (!window.confirm(msg)) return;
  busy = true;
  $("make").disabled = true;
  try {
    try { await getJobs(base); } catch (e) {
      note = { t: Date.now(), text: "The Razer isn't answering at " + base + ". Turn it on and try again." };
      return;
    }
    var byDrive = {};
    list.forEach(function (m) { var d = m.clip.split("/")[2]; (byDrive[d] = byDrive[d] || []).push(m); });
    var name = ((projName || "project").replace(/[^\w\- ]+/g, "_").trim() || "project") + " (made)";
    var fp = path.join(DIR, name + ".json"), d = { project: projName, razer: base, res: res, jobs: [] };
    try { d = JSON.parse(fs.readFileSync(fp, "utf8")); d.razer = base; } catch (e) {}
    var sent = 0, errs = [];
    for (var drive in byDrive) {
      var ms = byDrive[drive];
      var root = ms.map(function (m) { return path.dirname(m.clip); }).reduce(function (a, b) {
        while (b !== a && b.indexOf(a + "/") !== 0) a = path.dirname(a);
        return a;
      });
      var body = { path: path.relative("/Volumes", root), res: res, dry: false,
                   files: ms.map(function (m) { return path.relative(root, m.clip); }) };
      var reply;
      try {
        var r = await fetch(base + "/api/proxy", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        reply = await r.json();
        if (!r.ok || reply.error) throw new Error(reply.error || ("HTTP " + r.status));
      } catch (e) { errs.push(drive + ": " + (e.message || e)); continue; }
      var want = {};
      ms.forEach(function (m) { want[m.clip] = m; });
      for (var k = 0; k < (reply.jobs || []).length; k++) {
        var rj = reply.jobs[k], m = want[rj.clip] || want[path.join("/Volumes", rj.clip || "")];
        if (!m) continue;
        var o = await probe(m.clip) || {};
        d.jobs = d.jobs.filter(function (j) { return j.clip !== m.clip; });
        d.jobs.push({ id: rj.id, clip: m.clip, proxy: rj.proxy_mac || rj.proxy, tc: o.tc || "", fps: o.fps || 24, dur: o.dur || 0, replaces: m.bad || "" });
        sent++;
      }
    }
    fs.mkdirSync(DIR, { recursive: true });
    if (sent) fs.writeFileSync(fp, JSON.stringify(d, null, 1));
    note = { t: Date.now(), text: errs.length ? "The Razer couldn't take " + errs.join("; ") + (/not found|exist|mount/i.test(errs.join(" ")) ? " (it can't see that drive)" : "") :
      "Sent " + sent + " to the Razer. Each attaches here when it's done." };
  } finally {
    busy = false;
    $("make").disabled = false;
  }
  tick();
}
$("make").onclick = makeMissing;

$("again").onclick = function () { force = true; tick(); };

// ---- proxies that are already on the drive (Media Encoder, an earlier Kickoff, a DIT) ----
// For every clip in the project with no proxy: look in the Proxies folders near it (a Proxies*
// folder in any folder from the clip's own up to the drive's top, or inside an *Export* folder
// there), take the files whose name starts with the clip's name, and keep the one whose length and
// timecode match the original (check(), same as Razer proxies). The result is a job list like the
// Razer's, marked done, so tick() attaches it and puts it back if it's ever lost.
var VID = /\.(mov|mp4|mxf|m4v)$/i;
function ls(d) { try { return fs.readdirSync(d, { withFileTypes: true }); } catch (e) { return []; } }
function indexDir(d, out, depth) {
  ls(d).forEach(function (e) {
    var p = path.join(d, e.name);
    if (e.isDirectory() && depth < 4) indexDir(p, out, depth + 1);
    else if (e.isFile() && VID.test(e.name) && e.name[0] !== ".") out.push(p);
  });
}
function proxyFolders(clip, cache) {
  var dirs = [], d = path.dirname(clip), parts = clip.split("/");
  var top = parts[1] === "Volumes" ? "/" + parts.slice(1, 3).join("/") : path.dirname(d);
  for (;;) {
    if (!cache.dirs[d]) {
      var found = [];
      ls(d).forEach(function (e) {
        if (!e.isDirectory()) return;
        var p = path.join(d, e.name);
        if (/^prox/i.test(e.name)) found.push(p);
        else if (/export/i.test(e.name)) ls(p).forEach(function (f) { if (f.isDirectory() && /^prox/i.test(f.name)) found.push(path.join(p, f.name)); });
      });
      cache.dirs[d] = found;
    }
    dirs = dirs.concat(cache.dirs[d]);
    if (d === top || path.dirname(d) === d) break;
    d = path.dirname(d);
  }
  return dirs;
}
function stem(p) { return path.basename(p).replace(/\.[^.]+$/, "").toLowerCase(); }
async function findOnDrive() {
  if (busy) return setTimeout(findOnDrive, 500);
  busy = true;
  $("find").disabled = true;
  try {
    $("foot").textContent = "Looking for proxies on the drive...";
    var clips = [];
    try { clips = JSON.parse(await evalHost("kickoffNoProxy()")) || []; } catch (e) { clips = []; }
    var proj = "";
    try { proj = (await evalHost("app.project.name")).replace(/\.prproj$/i, ""); } catch (e) {}
    if (!clips.length) { $("foot").textContent = "Every clip in this project already has a proxy."; return; }
    var cache = { dirs: {}, files: {}, probes: {}, used: {} }, jobs = [], n = 0;
    for (var i = 0; i < clips.length; i++) {
      var clip = clips[i], cands = [];
      $("foot").textContent = "Checking " + (i + 1) + " of " + clips.length + ": " + path.basename(clip);
      proxyFolders(clip, cache).forEach(function (f) {
        if (!cache.files[f]) { cache.files[f] = []; indexDir(f, cache.files[f], 0); }
        cache.files[f].forEach(function (p) {
          var s = stem(p), c = stem(clip);
          if (p !== clip && s.indexOf(c) === 0 && !/[0-9a-z]/.test(s.charAt(c.length))) cands.push(p);
        });
      });
      var orig = await probe(clip);
      if (!orig) continue;
      if (!cands.length) {
        // nothing named like it (renamed since the proxies were made): any proxy in those folders
        // with the same timecode and length, not already taken by another clip
        if (!orig.tc) continue;
        var tj = { tc: orig.tc, fps: orig.fps || 24, dur: orig.dur }, all = [];
        proxyFolders(clip, cache).forEach(function (f) { all = all.concat(cache.files[f] || []); });
        for (var a = 0; a < all.length; a++) {
          if (cache.used[all[a]]) continue;
          if (!(all[a] in cache.probes)) cache.probes[all[a]] = await probe(all[a]);
          if (!check(tj, cache.probes[all[a]])) { cands.push(all[a]); break; }
        }
        if (!cands.length) continue;            // no proxy found for it: left alone, not refused
      }
      var job = { id: "drive:" + clip, clip: clip, proxy: cands[0], tc: orig.tc, fps: orig.fps || 24, dur: orig.dur, local: true };
      // the plainest name first (A001_Proxy.mov before A001_Proxy_1.mov)
      cands.sort(function (a, b) { return a.length - b.length || a.localeCompare(b); });
      var why = "";
      for (var k = 0; k < cands.length; k++) {
        why = check(job, await probe(cands[k]));
        if (!why) { job.proxy = cands[k]; cache.used[cands[k]] = 1; break; }
      }
      if (why) job.problem = why + " (" + path.basename(cands[0]) + ")"; else { job.verified = true; n++; }
      jobs.push(job);
    }
    var name = ((proj || "project").replace(/[^\w\- ]+/g, "_").trim() || "project") + " (on the drive)";
    if (jobs.length) {
      fs.mkdirSync(DIR, { recursive: true });
      var fpd = path.join(DIR, name + ".json"), old = [];
      try { old = JSON.parse(fs.readFileSync(fpd, "utf8")).jobs || []; } catch (e) {}
      var mine = {};
      jobs.forEach(function (j) { mine[j.clip] = 1; });
      jobs = old.filter(function (j) { return !mine[j.clip]; }).concat(jobs);   // adds to the earlier search
      fs.writeFileSync(fpd, JSON.stringify({ project: proj || "This project", made: new Date().toISOString(), jobs: jobs }, null, 1));
    }
    note = { t: Date.now(), text: "" };
    note.text = $("foot").textContent = jobs.length ? "Found " + n + " matching prox" + (n === 1 ? "y" : "ies") + (jobs.length > n ? ", " + (jobs.length - n) + " that don't match" : "") + "." :
      "No proxies named like these clips in a Proxies folder near them.";
  } finally {
    busy = false;
    $("find").disabled = false;
  }
  tick();
}
$("find").onclick = findOnDrive;
tick();
setInterval(tick, 10000);
</script>
