<!doctype html>
<html><head><meta charset="utf-8"><title>Kickoff</title>
<style>
:root{
  --bg:#17191d; --panel:#20242a; --ink:#eef0f3; --muted:#9097a3; --line:#2e333b;
  --accent:#f0962e; --good:#6fcf97; --warn:#f2c14e; --bad:#ef6b6b;
  --display:"Bricolage Grotesque",-apple-system,Helvetica,sans-serif;
  --body:"IBM Plex Sans",-apple-system,Helvetica,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--body);display:flex;flex-direction:column;padding:14px 16px 12px;overflow:hidden}
header{display:flex;align-items:center;gap:10px}
.brand{font:700 15px var(--display);color:var(--accent);letter-spacing:.2px}
.project{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:600 12px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.hero{display:flex;align-items:baseline;gap:10px;margin:14px 0 8px}
.count{font:700 44px/1 var(--display)}
.count small{font-size:24px;color:var(--muted)}
.label{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .4s}
.fill.done{background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.on{background:var(--good)} .run{background:var(--accent)} .wait{background:var(--muted)} .bad{background:var(--bad)}
.list{flex:1;overflow-y:auto;border-top:1px solid var(--line);margin:0 -4px;padding:4px}
.row{display:flex;align-items:flex-start;gap:9px;padding:6px 2px;border-bottom:1px solid var(--line)}
.row .dot{margin-top:5px}
.name{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{font-size:12px;color:var(--muted)}
.why.badtext{color:var(--bad)}
.grow{flex:1;min-width:0}
.px{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.show{flex:none;font-size:11px;padding:3px 8px;align-self:center}
button.make{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.choose{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding:8px 10px;background:var(--panel);border-radius:8px;font-size:12px}
.choose span{flex:1 1 100%;color:var(--ink)}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:var(--muted);gap:6px}
.empty b{font:700 16px var(--display);color:var(--ink)}
.tabs{display:flex;gap:2px;background:var(--panel);border-radius:9px;padding:3px}
.tab{border:0;border-radius:7px;padding:5px 12px;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab.sel{background:var(--bg);color:var(--accent)}
.project{text-align:right}
.view{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:12px}
.tools{display:flex;gap:8px;align-items:center}
.scope{margin-left:auto;display:flex;gap:2px;background:var(--panel);border-radius:8px;padding:2px}
.scope button{border:0;border-radius:6px;padding:4px 9px;color:var(--muted);font-weight:500}
.scope button.sel{background:var(--bg);color:var(--accent)}
button.link{border:0;padding:4px 0;color:var(--muted);align-self:flex-start;font-weight:500}
button.link:hover{color:var(--accent)}
.form{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center;margin-top:4px}
.field{display:contents}
.field>label{color:var(--muted);font-size:12px;white-space:nowrap}
input[type=text]{font:13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%;max-width:340px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.sw.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-width:40px;padding:5px 9px}
.pill.sel{background:var(--accent);border-color:var(--accent);color:#17191d}
.pill.full{opacity:.45}
.go{display:flex;align-items:center;gap:10px;margin-top:18px}
button.big{font:700 14px var(--display);background:var(--accent);border-color:var(--accent);color:#17191d;padding:10px 22px;border-radius:9px}
button.big:hover{color:#17191d;filter:brightness(1.08)}
.i{position:relative;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font:italic 600 11px/16px var(--body);text-align:center;cursor:default;flex:none}
.i:hover,.i:focus{color:var(--ink);border-color:var(--muted);outline:none}
.i:hover::after,.i:focus::after{content:attr(data-tip);position:absolute;left:26px;top:50%;transform:translateY(-50%);width:300px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:400 12px/1.45 var(--body);text-align:left;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#vSync{margin:10px -16px -12px}
#app{flex:1;border:0;width:100%;background:var(--bg)}
.foot{color:var(--muted);font-size:11px;margin-top:6px;min-height:14px}
</style></head>
<body>
<header><span class="brand">Kickoff</span>
  <nav class="tabs"><button class="tab sel" data-v="vSync">Sync</button><button class="tab" data-v="vProxies">Proxies</button><button class="tab" data-v="vAdj">Adjustment Layer</button></nav>
  <span class="project" id="project"></span></header>

<section class="view" id="vSync"><iframe id="app" title="Kickoff"></iframe>
  <div class="empty" id="noApp" style="display:none"><b>Kickoff isn't installed on this Mac</b>Run the Kickoff installer, then reopen this panel.</div></section>

<section class="view" id="vProxies" style="display:none">
  <div class="tools">
    <button id="make" class="make" style="display:none" title="Renders the missing ones on this Mac or the Razer, then attaches them here.">Create missing proxies</button>
    <button id="find" title="Looks for proxies already on the drive (Proxies folders near the footage), checks every proxy again, and attaches the ones that match">Find &amp; attach</button>
    <span class="scope" id="scope" title="This sequence counts only the clips the open sequence uses, including every angle inside its multicams and nests."><button data-s="seq">This sequence</button><button data-s="all">Whole project</button></span>
  </div>
  <div class="choose" id="choose" style="display:none"><span id="chooseText"></span>
    <button id="chMac">On the Mac (fast)</button><button id="chRazer">On the Razer (keep editing)</button><button id="chNo">Cancel</button></div>
  <div id="main" style="display:none;flex:1;min-height:0;flex-direction:column">
    <div class="hero"><span class="count" id="count">0</span><span class="label" id="label">proxies attached</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="chips" id="chips"></div>
    <button id="showList" class="link">Show every clip</button>
    <div class="list" id="list" style="display:none"></div>
  </div>
  <div class="empty" id="empty"><b>No proxies yet</b>Proxies already on the drive: press Find &amp; attach.<br>New ones: turn on Settings &gt; Proxies in Kickoff, and each is attached as it finishes.</div>
  <div class="foot" id="foot"></div>
</section>

<section class="view" id="vAdj" style="display:none">
  <div class="form">
    <div class="field"><label>Name</label><input id="adjName" type="text" spellcheck="false"></div>
    <div class="field"><label>Label color</label><div class="swatches" id="adjColor"></div></div>
    <div class="field"><label>Goes on</label><div class="pills" id="adjTo"></div></div>
    <div class="field"><label>Cuts at the edits of</label><div class="pills" id="adjFrom"></div></div>
  </div>
  <div class="go"><button id="adjGo" class="big">Create adjustment layer</button>
    <span class="i" tabindex="0" data-tip="One piece per shot. The top track wins where clips overlap, gaps stay empty, and through-edits are not cut. The track it goes on must be empty.">i</span></div>
  <div class="foot" id="adjMsg"></div>
</section>
<script>
// Attaches each proxy the Razer finishes to its clip in the open project, once the proxy's length and
// timecode match the original (a duplicate or cut-short render is never attached). Every 10 s it also
// puts back any proxy a clip has lost (a re-import, a detach). Kickoff writes the jobs to
// ~/Library/Application Support/Kickoff/proxy-jobs/<project>.json.
var fs = require("fs"), path = require("path"), os = require("os"), cp = require("child_process");
var HOME = os.homedir(), DIR = path.join(HOME, "Library/Application Support/Kickoff/proxy-jobs");
var FONTS = path.join(HOME, "Library/Application Support/Kickoff/ui/fonts");
var FFPROBE = ["/opt/homebrew/bin/ffprobe", "/usr/local/bin/ffprobe"].filter(function (p) { return fs.existsSync(p); })[0];
var busy = false, force = false, note = null;
// Proxies tab scope: "seq" = only the clips the open sequence uses (multicam angles and nests included)
var scope = localStorage.proxyScope === "all" ? "all" : "seq", seqInfo = null;
function scopeUI() { [].forEach.call($("scope").children, function (b) { b.classList.toggle("sel", b.dataset.s === scope); }); }
// the set of media paths in scope, or null for the whole project; seqInfo.err when no sequence is open
async function scopePaths() {
  seqInfo = null;
  if (scope !== "seq") return null;
  try { seqInfo = JSON.parse(await evalHost("kickoffSeqPaths()")); } catch (e) { seqInfo = { err: "noseq" }; }
  var set = {};
  (seqInfo.paths || []).forEach(function (p) { set[p] = 1; });
  return set;
}

// the window's own fonts, when Kickoff is installed (the panel works without them)
[["Bricolage Grotesque", "bricolage-700.woff2", "700"], ["IBM Plex Sans", "plex-sans.woff2", "100 700"]].forEach(function (f) {
  var p = path.join(FONTS, f[1]);
  if (fs.existsSync(p)) {
    var st = document.createElement("style");
    st.textContent = '@font-face{font-family:"' + f[0] + '";font-weight:' + f[2] + ';src:url("file://' + encodeURI(p) + '") format("woff2")}';
    document.head.appendChild(st);
  }
});

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function evalHost(code) {
  return new Promise(function (ok) { window.__adobe_cep__.evalScript(code, function (r) { ok(r); }); });
}
function probe(file) {
  return new Promise(function (ok) {
    if (!FFPROBE) return ok(null);
    cp.execFile(FFPROBE, ["-v", "error", "-print_format", "json", "-show_format", "-show_streams", file],
      { timeout: 20000 }, function (err, out) {
        if (err) return ok(null);
        try {
          var j = JSON.parse(out), f = j.format || {}, tc = (f.tags || {}).timecode || "", fps = 0;
          (j.streams || []).forEach(function (s) {
            if (!tc && s.tags && s.tags.timecode) tc = s.tags.timecode;
            if (!fps && s.codec_type === "video" && s.avg_frame_rate) {
              var r = s.avg_frame_rate.split("/"); fps = +r[1] ? r[0] / r[1] : 0;
            }
          });
          var au = (j.streams || []).filter(function (s) { return s.codec_type === "audio"; });
          ok({ dur: parseFloat(f.duration || 0), tc: tc, fps: fps, video: (j.streams || []).some(function (s) { return s.codec_type === "video"; }),
               aud: { ch: au.reduce(function (n, s) { return n + (s.channels || 0); }, 0),
                      pairs: au.filter(function (s) { return s.channels === 2 && /stereo/.test(s.channel_layout || ""); }).length } });
        } catch (e) { ok(null); }
      });
  });
}
function frames(tc, fps) {
  var m = /^(\d+):(\d+):(\d+)[:;.](\d+)$/.exec(tc || ""), r = Math.round(fps || 24);
  return m ? ((+m[1] * 60 + +m[2]) * 60 + +m[3]) * r + +m[4] : null;
}
function check(job, p) {
  if (!p) return "Kickoff couldn't read the proxy";
  var slack = 0.1 + 1 / (job.fps || 24);
  if (Math.abs(p.dur - job.dur) > slack) return "proxy is " + p.dur.toFixed(1) + " s, the clip " + job.dur.toFixed(1) + " s";
  if (job.tc) {
    var a = frames(job.tc, job.fps), b = frames(p.tc, job.fps);
    if (b === null || a !== b) return "proxy timecode " + (p.tc || "missing") + ", the clip " + job.tc;
  }
  return "";
}
// a proxy's audio against its clip's: the same number of channels, and a stereo pair only where
// the clip has one (Premiere won't relink a proxy whose audio layout differs from the clip's)
function audWhy(job, p) {
  if (!job.aud || !p || !p.aud) return "";
  if (p.aud.ch !== job.aud.ch) return "proxy has " + p.aud.ch + " audio channels, the clip " + job.aud.ch;
  if (p.aud.pairs > job.aud.pairs) return "proxy audio is a stereo pair, the clip has " + job.aud.ch + " separate channels";
  return "";
}
function getJobs(base) {
  return fetch(base + "/api/jobs").then(function (r) { return r.json(); }).then(function (j) { return j.jobs || []; });
}

async function tick() {
  if (busy) return;
  busy = true;
  var offline = false;
  try {
    var files = fs.existsSync(DIR) ? fs.readdirSync(DIR).filter(function (f) { return /\.json$/.test(f); }) : [];
    var sets = [];
    for (var fi = 0; fi < files.length; fi++) {
      var fp = path.join(DIR, files[fi]), d;
      try { d = JSON.parse(fs.readFileSync(fp, "utf8")); } catch (e) { continue; }
      if (force && !d.jobs.some(function (j) { return j.local; })) d.jobs.forEach(function (j) { delete j.problem; delete j.verified; });
      if (d.pending) await startPending(d);
      for (var mi = 0; mi < d.jobs.length; mi++) {
        var mj = d.jobs[mi];
        if ((mj.where === "mac" || mj.where === "rzw") && !mj.verified && !mj.problem) await checkFile(mj);
      }
      var open = d.jobs.filter(function (j) { return j.id && !j.verified && !j.problem && !j.local && !j.where; });
      if (open.length) {
        var live = null;
        try { live = await getJobs(d.razer); } catch (e) { offline = true; }
        if (live) {
          var byId = {};
          live.forEach(function (j) { byId[j.id] = j; });
          for (var k = 0; k < open.length; k++) {
            var job = open[k], lj = byId[job.id];
            job.razer = lj ? lj.state : "";
            if (!lj) continue;
            if (lj.state === "failed" || lj.state === "cancelled") { job.problem = "the Razer couldn't create it" + (lj.error ? " (" + lj.error + ")" : ""); continue; }
            if (lj.state !== "done") { job.stage = lj.n && lj.total ? Math.round(100 * lj.n / lj.total) + "%" : ""; continue; }
            job.proxy = lj.proxy_mac || job.proxy;
            var why = check(job, await probe(job.proxy));
            if (why) job.problem = why; else job.verified = true;
          }
        }
      }
      fs.writeFileSync(fp, JSON.stringify(d, null, 1));
      sets.push({ file: fp, d: d, mtime: fs.statSync(fp).mtimeMs });
    }
    force = false;
    // one pass over the open project for every checked proxy
    var ready = [];
    sets.forEach(function (s) { s.d.jobs.forEach(function (j) { if (j.verified) ready.push({ clip: j.clip, proxy: j.proxy }); }); });
    var inProj = {};
    if (ready.length) {
      try { inProj = JSON.parse(await evalHost("kickoffSync(" + JSON.stringify(JSON.stringify(ready)) + ")")) || {}; } catch (e) { inProj = {}; }
    }
    // a remade proxy is attached: the bad one it replaced goes to the Trash (listed when you confirmed)
    for (var si = 0; si < sets.length; si++) {
      var dirty = false;
      sets[si].d.jobs.forEach(function (j) {
        if (j.replaces && !j.trashed && j.verified && inProj[j.clip] === "on") { trash(j.replaces); j.trashed = true; dirty = true; }
      });
      if (dirty) fs.writeFileSync(sets[si].file, JSON.stringify(sets[si].d, null, 1));
    }
    var all = [];
    try { all = JSON.parse(await evalHost("kickoffAll()")) || []; } catch (e) { all = []; }
    var only = await scopePaths();
    if (only) all = all.filter(function (c) { return only[c[0]]; });
    var byClip = {};
    sets.sort(function (a, b) { return a.mtime - b.mtime; }).forEach(function (s) {
      s.d.jobs.forEach(function (j) { byClip[j.clip] = j; });     // the newest set's job wins
    });
    render(all, byClip, offline);
  } finally { busy = false; }
}

var missing = [];
function render(all, byClip, offline) {
  var rows = [], n = { on: 0, run: 0, wait: 0, bad: 0, none: 0 };
  missing = [];
  all.forEach(function (c) {
    var clip = c[0], px = c[1], j = byClip[clip], st, why, file = "";
    if (px) { st = "on"; why = "attached" + (j && j.warn && j.proxy === px ? " (relinking by hand won't work: " + j.warn + ")" : ""); file = px === "?" ? "" : px; }
    else if (j && j.problem) { st = "bad"; why = j.problem; file = j.proxy || ""; }
    else if (j && j.verified) { st = "bad"; why = "Premiere wouldn't take this proxy"; file = j.proxy || ""; }
    else if (j && j.where === "mac") { st = "run"; why = "rendering on this Mac"; }
    else if (j && j.where === "rzw") { st = "run"; why = "rendering on the Razer"; }
    else if (j && j.id && !j.local) { st = "run"; why = j.razer === "running" ? "rendering on the Razer" + (j.stage ? " " + j.stage : "") : "waiting on the Razer"; }
    else { st = "none"; why = "no proxy"; }
    if (st === "bad" || st === "none") missing.push({ clip: clip, bad: st === "bad" ? file : "" });
    n[st]++;
    rows.push({ st: st, why: why, name: path.basename(clip), file: file });
  });
  var total = rows.length;
  var noSeq = scope === "seq" && seqInfo && seqInfo.err;
  $("main").style.display = total ? "flex" : "none";
  $("empty").style.display = total ? "none" : "flex";
  $("empty").innerHTML = noSeq ? "<b>Open a sequence</b>Click in a timeline, or switch to Whole project." :
    scope === "seq" && seqInfo ? "<b>No video clips in " + esc(seqInfo.name) + "</b>Switch to Whole project to see every clip." : EMPTY;
  $("project").textContent = projName;
  $("count").innerHTML = n.on + "<small> / " + total + "</small>";
  $("label").textContent = "proxies attached" + (scope === "seq" && seqInfo && seqInfo.name ? " in " + seqInfo.name : "") +
    (n.on === total && total ? ", all done" : "");
  $("fill").style.width = total ? (100 * n.on / total) + "%" : "0";
  $("fill").className = "fill" + (total && n.on === total ? " done" : "");
  var chips = [["run", n.run, "rendering"], ["bad", n.bad, "refused"], ["wait", n.none, "no proxy"]];
  $("chips").innerHTML = chips.filter(function (c) { return c[1]; }).map(function (c) {
    return '<span class="chip"><span class="dot ' + c[0] + '"></span>' + c[1] + " " + c[2] + "</span>";
  }).join("");
  $("make").style.display = missing.length ? "" : "none";
  if (!missing.length) $("choose").style.display = "none";     // nothing left to make: drop an open question
  $("make").textContent = "Create missing proxies (" + missing.length + ")";
  var order = { bad: 0, none: 1, run: 2, on: 3 };
  rows.sort(function (a, b) { return order[a.st] - order[b.st] || a.name.localeCompare(b.name); });
  $("list").innerHTML = rows.map(function (r) {
    var where = r.file ? '<div class="px">' + esc(path.basename(r.file)) + "  in  " + esc(path.dirname(r.file)) + "</div>" : "";
    return '<div class="row"><span class="dot ' + (r.st === "none" ? "wait" : r.st) + '"></span><div class="grow"><div class="name">' + esc(r.name) +
      '</div><div class="why' + (r.st === "bad" ? " badtext" : "") + '">' + esc(r.why) + "</div>" + where + "</div>" +
      (r.file ? '<button class="show" data-path="' + esc(r.file) + '">Show in Finder</button>' : "") + "</div>";
  }).join("");
  $("foot").textContent = offline ? "The Razer isn't answering. Proxies still rendering will attach once it's back." :
    note && Date.now() - note.t < 60000 ? note.text : "Checks every 10 seconds.";
}
var projName = "";
evalHost("app.project.name").then(function (r) { projName = String(r || "").replace(/\.prproj$/i, ""); });
$("list").onclick = function (e) {
  var b = e.target.closest ? e.target.closest("button.show") : null;
  if (b) cp.execFile("/usr/bin/open", ["-R", b.getAttribute("data-path")]);
};
function trash(p) {
  if (!p || !fs.existsSync(p)) return;
  cp.execFile("/usr/bin/osascript", ["-e", 'tell application "Finder" to delete (POSIX file ' + JSON.stringify(p) + " as alias)"], function () {});
}
function kickoffSettings() {
  try { return JSON.parse(fs.readFileSync(path.join(HOME, "Library/Application Support/Kickoff/settings.json"), "utf8")) || {}; } catch (e) { return {}; }
}

// ---- Making proxies: on this Mac (fast) or on the Razer (keep editing) ----
var lastChoice = null;
function razerBase() { return (kickoffSettings().razer_url || "http://kickoff.local").replace(/\/$/, ""); }
function resFor(d) { var r = (d && d.res) || kickoffSettings().razer_proxies; return r === "1080" ? "1080" : "720"; }
async function razerUp(base) { try { await getJobs(base); return true; } catch (e) { return false; } }

// Kickoff's engine makes the proxies (ffmpeg, ProRes Proxy, the clip's timecode, its audio channels
// exactly as the camera recorded them), one at a time; each file appears only when it's complete
var SUPPORT = path.join(HOME, "Library/Application Support/Kickoff");
async function plan(list, d, where) {
  var pairs = [], jobs = [];
  for (var i = 0; i < list.length; i++) {
    var m = list[i], dir = path.join(path.dirname(m.clip), "Proxies"), stem = path.basename(m.clip).replace(/\.[^.]+$/, "");
    var out = path.join(dir, stem + "_Proxy.mov"), k = 1;

// adjPieces(tracks, frameTicks): tracks are the picked source tracks, bottom first, each a list of
// clips {s, e, i, o, sp, rev, src} in ticks. Returns [[start, end]...] for the adjustment layer: at
// each moment the top track with footage owns the picture, a new piece starts wherever the owning
// clip changes, nothing goes where no track has footage, and no piece is dropped however short. A

// ---- Sync tab: the Kickoff window itself, inside the panel ----

  'function paths(e){var p=[],u=e.dataTransfer.getData("text/uri-list")||"";u.split(/\\r?\\n/).forEach(function(l){if(/^file:/.test(l))p.push(decodeURIComponent(l.replace(/^file:\\/\\/(localhost)?/,"")).replace(/\\/$/,""));});' +
  'if(!p.length)[].forEach.call(e.dataTransfer.files||[],function(f){if(f.path)p.push(f.path);});return p;}' +

  'document.addEventListener("dragleave",function(e){if(!e.relatedTarget)parent.postMessage({drag:[false]},"*");});' +
  'document.addEventListener("drop",function(e){e.preventDefault();parent.postMessage({drop:[paths(e),e.clientX,e.clientY]},"*");});' +
  '})();<\/script><style>.xname,#destPr,.brand,#intro,.titlebar,main>.foot{display:none!important}.top{justify-content:flex-end!important}main{height:100%!important;padding:8px 24px 6px!important;gap:10px!important}#bStart{padding:11px 20px!important}' +
  // the panel is short: smaller drop boxes and template rows, so nothing slides under Start

  // Premiere\'s browser has no color-mix(): plain colours so the boxes and buttons still show

  '#vRun>#hints{flex:none!important;overflow:visible!important}' +
  '#hints{gap:6px!important}#hints .td{display:none!important}#hints .trow{padding-block:7px!important}#hints .tico{width:28px!important;height:28px!important}' +
  // Premiere's browser has no popovers, so the info text showed all the time: hidden until the i is hovered or clicked

  '<script>document.addEventListener("DOMContentLoaded",function(){[].forEach.call(document.querySelectorAll("[popovertarget]"),function(b){' +
  'var t=document.getElementById(b.getAttribute("popovertarget"));if(!t)return;b.removeAttribute("popovertarget");' +
  'function show(on){t.classList.toggle("kshow",on);b.classList.toggle("on",on);if(!on)return;var r=b.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;' +
  't.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+"px";t.style.top=(r.top-h-8>8?r.top-h-8:Math.min(innerHeight-h-8,r.bottom+8))+"px";}' +

function appCall(fn) {

function readJSON(p, d) { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch (e) { return d; } }
function isUsable(p) {
  try { return fs.statSync(p).isDirectory() || AUDIO_X.test(p) || VIDEO_X.test(p); } catch (e) { return false; }
}
function loadApp() {
  var src = path.join(UI, "index.html");
  if (!fs.existsSync(src)) { $("app").style.display = "none"; $("noApp").style.display = "flex"; return; }
  var html = fs.readFileSync(src, "utf8").replace(/<head>/i, "<head>" + BRIDGE);
  fs.writeFileSync(path.join(UI, "panel.html"), html);

function folderTree(dir, depth) {
  if (depth >= 4) return [];
  var out = [];
  ls(dir).filter(function (e) { return e.isDirectory() && e.name[0] !== "." && !/\.(app|fcpbundle|fcpxmld|bundle|pkg)$/i.test(e.name); })
    .sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); })
    .slice(0, 60).forEach(function (e) {
      var bin = { name: e.name }, kids = folderTree(path.join(dir, e.name), depth + 1);

function pickFor(target, row) {
  if (sync.proc) return;
  var folderOnly = target === "export" || target === "prproj" || target === "template";
  var files = target === "song" || target === "xml" || target === "convert";
  var types = target === "song" ? ["wav", "aif", "aiff", "bwf", "mp3", "m4a", "flac", "aac", "caf"]
    : target === "xml" ? ["xml"] : target === "convert" ? ["xml", "fcpxml", "drp", "prproj"] : null;
  var title = { song: "Choose the song", footage: "Choose the footage: the shoot folder, a day, cards or clips",
    export: "Choose the folder the XML goes in", prproj: "Choose the folder the Premiere project goes in",
    template: "Choose a project folder. Kickoff makes a template from its folders",
    xml: "Choose your synced sequence XML", convert: "Choose an XML, FCPXML, DaVinci project or Premiere project" }[target] ||
    "Choose the shoot folder or cards";

  var r = window.cep.fs.showOpenDialogEx(multi, !files, title, "", types || []);

  if (target === "template") return appCall("folderTree", path.basename(picked[0]), folderTree(picked[0], 0));

  if (folderOnly) return appCall("picked", [picked[0]], target, row == null ? -1 : row);

function lines(stream, fn) {
  var buf = "";
  stream.setEncoding("utf8");
  stream.on("data", function (d) {
    buf += d;
    var i;
    while ((i = buf.indexOf("\n")) >= 0) { fn(buf.slice(0, i)); buf = buf.slice(i + 1); }

// a finished main run (not a Slop Cut, Resolve build or Convert): its XML goes into the open project
async function importXml(xml) {
  if (!xml || sync.imported[xml] || !fs.existsSync(xml)) return;
  sync.imported[xml] = 1;
  await evalHost("kickoffImport(" + JSON.stringify(xml) + ")");
}
function setPausedSync(on) {
  if (!sync.proc) return;
  try { process.kill(sync.proc.pid, on ? "SIGSTOP" : "SIGCONT"); } catch (e) {}
  cp.execFile("/usr/bin/pkill", [on ? "-STOP" : "-CONT", "-P", String(sync.proc.pid)], function () {});
}
async function runSync(m) {

  sync.runMode = sync.mode;
  sync.stopped = false;
  var name = (m.xmlName || "").trim();
  if (!/^(slop|slopimport|resolve|convert-)/.test(sync.runMode)) {
    var pn = String(await evalHost("kickoffProjectName()") || "");
    if (pn && !/^EvalScript error/.test(pn)) {
      // the next song of the same Start (it begins right after the last one ends) gets its own XML
      var next = sync.lastEnd && Date.now() - sync.lastEnd < 60000 && sync.lastPaths !== paths.join("|");
      name = next ? pn + " - " + path.basename(paths.filter(function (q) { return !AUDIO_X.test(q); })[0] || paths[0]).replace(/\.[^.]+$/, "") : pn;

window.addEventListener("message", function (ev) {

    return ps.length && appCall("drop", ps, d.drop[1], d.drop[2]);

    case "mode": sync.mode = m.mode || "auto"; break;
    case "rebuild": sync.rebuild = !!m.on; break;
    case "pick": pickFor(m.target || "any", m.row); break;
    case "run": runSync(m); break;
    case "history-add":

    case "pause": setPausedSync(true); break;
    case "resume": setPausedSync(false); break;

    case "makeProject": break;                             // the open project is the project
    case "revealProject": case "reveal": if (m.path) cp.execFile("/usr/bin/open", ["-R", m.path]); break;
    case "report": if (m.path) cp.execFile("/usr/bin/open", [m.path], function (err) { if (err) cp.execFile("/usr/bin/open", ["-t", m.path]); }); break;

// a file dropped outside the window doesn't open in the panel in its place
